<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>글로벌 미디어 제국 시뮬레이터</title>
    <!-- 외부 파일 연결 -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div id="setup-modal" class="overlay">
    <div class="modal">
        <h2 style="color: #3b82f6; text-align: center;">📰 언론사 창간 (Setup)</h2>
        <label><b>언론사 이름:</b></label>
        <input type="text" id="company-name" class="input-box" value="대제국일보">
        
        <label><b>시작 거점 선택 (지도를 클릭하시오):</b></label>
        <div id="setup-map" style="height: 200px; width: 100%; border-radius: 6px; margin: 10px 0; border: 1px solid #475569; z-index: 2001;"></div>
        <p id="selected-coords" style="font-size: 13px; color: #a3e635; margin-top: -5px;">위치: 대한민국 서울 (기본값)</p>

        <label><b>시작 연도 (1577 ~ 2026):</b></label>
        <input type="number" id="start-year" class="input-box" min="1577" max="2026" value="1840">
        
        <label><b>경영 난이도:</b></label>
        <select id="difficulty" class="input-box">
            <option value="Easy">쉬움 (유지비 감소)</option>
            <option value="Normal" selected>보통</option>
            <option value="Hard">어려움 (유지비 증가)</option>
        </select>
        
        <label><b>초기 창업 자본:</b></label>
        <select id="start-cap" class="input-box">
            <option value="50000">₩ 50,000 (스타트업)</option>
            <option value="100000" selected>₩ 100,000 (표준)</option>
            <option value="200000">₩ 200,000 (중견 기업)</option>
            <option value="1000000">₩ 1,000,000 (재벌 자본)</option>
        </select>
        <button id="btn-start" style="width: 100%; margin-top: 15px; font-size: 16px; padding: 15px;" onclick="startGame()">역사 속으로 뛰어들기</button>
    </div>
</div>

<div id="event-modal" class="overlay" style="display: none;">
    <div class="modal" style="border-color: #ef4444;">
        <h2 id="ev-title" style="color: #ef4444;">이벤트 발생</h2>
        <p id="ev-desc"></p>
        <div id="ev-choices"></div>
    </div>
</div>

<header>
    <h2 id="ui-company-name">글로벌 미디어 제국</h2>
    <div class="hud">
        <div><span>연도:</span> <b id="ui-year">-</b></div>
        <div><span>자본:</span> <b id="ui-cap">-</b></div>
        <div><span>신뢰도:</span> <b id="ui-cred">-</b></div>
        <div><span>영향력:</span> <b id="ui-reach">-</b></div>
    </div>
    <button onclick="advanceTurn()" class="success">▶ 턴 종료 (다음 해로)</button>
</header>

<div class="container" id="game-ui" style="display: none;">
    <div>
        <div class="card">
            <h3>🗺️ OSM 전파망 구축 및 감가상각</h3>
            <div id="map"></div>
            
            <div style="display: flex; gap: 10px;">
                <select id="tx-type" class="input-box" onchange="updateBandFormatOptions()">
                    <option value="Print">인쇄소/조보 지국</option>
                    <option value="Radio">라디오 송신소</option>
                    <option value="TV">TV 방송국</option>
                </select>
                <select id="tx-band" class="input-box" disabled>
                    <option value="Print">인쇄/필사</option>
                </select>
                <select id="tx-format" class="input-box" disabled>
                    <option value="None">해당 없음</option>
                </select>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 5px;">
                <input type="text" id="tx-name" class="input-box" placeholder="지점/송신소 이름">
                <input type="text" id="tx-callsign" class="input-box" placeholder="호출부호 없음" disabled style="width: 150px;">
                <input type="number" id="tx-power" class="input-box" value="50" placeholder="출력/부수" style="width: 100px;">
                <button onclick="buildInfra()">건설</button>
            </div>
            <div id="infra-list" style="max-height: 150px; overflow-y: auto; margin-top: 15px;"></div>
        </div>

        <div class="card">
            <h3>🔬 미디어 기술 연구</h3>
            <div id="tech-list" style="max-height: 150px; overflow-y: auto;"></div>
        </div>
    </div>

    <div>
        <div class="card">
            <h3>⚖️ 여론 지형 (오버톤의 창)</h3>
            <canvas id="overtonChart"></canvas>
            <input type="range" id="stance-slider" min="-3" max="3" step="0.1" value="0.0" style="width: 100%; margin-top: 10px;" oninput="updateStance(this.value)">
            <p style="text-align: center; margin: 5px 0;">현재 논조: <b id="ui-stance" style="color: #ef4444;">0.0</b></p>
        </div>

        <div class="card">
            <h3>💼 자본과 저널리즘의 딜레마</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
                <button class="danger" onclick="doAction('scoop')">🔥 거악 특종 폭로</button>
                <button onclick="doAction('advertorial')">🤝 기사형 광고(협찬)</button>
                <button onclick="doAction('mna')">📺 종편 인수 (₩80k)</button>
                <button class="success" onclick="doAction('paywall')">🧱 페이월 도입</button>
            </div>

            <h3 style="border-top: 1px solid #334155; padding-top: 10px;">👥 직원 스트레스 관리 (HR)</h3>
            <div id="ui-reporters" style="max-height: 150px; overflow-y: auto;"></div>
            <button style="width: 100%; margin-top: 10px;" onclick="manageHR('hire', 0)">👤 새 직원 스카우트 (₩10k)</button>
        </div>

        <div class="card">
            <h3>📜 연대기 로그</h3>
            <div class="log-box" id="ui-logs"></div>
        </div>
    </div>
</div>

<!-- 외부 자바스크립트 연결 -->
<script src="script.js"></script>
</body>
</html>
